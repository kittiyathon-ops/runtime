<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Runtime Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
    body { background:#020617; color:#e2e8f0; min-height:100vh; padding:20px; }
    .container { max-width:1400px; margin:auto; }
    .title { font-size:28px; color:#38bdf8; margin-bottom:25px; font-weight:bold; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:25px; }
    .card { background:#0f172a; padding:20px; border-radius:16px; border:1px solid rgba(255,255,255,0.08); }
    .card-title { color:#94a3b8; margin-bottom:10px; font-size:13px; }
    .card-value { font-size:28px; font-weight:bold; }
    .positive { color:#22c55e; }
    .negative { color:#ef4444; }
    .panel { background:#0f172a; border-radius:16px; padding:24px; margin-bottom:25px; border:1px solid rgba(255,255,255,0.08); }
    h2 { margin-bottom:20px; color:#38bdf8; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:14px; border-bottom:1px solid rgba(255,255,255,0.08); text-align:left; }
    th { color:#94a3b8; font-size:13px; }
    canvas { max-height:360px; }
    .footer { margin-top:20px; text-align:center; color:#64748b; font-size:13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">⚡ Autonomous Trading Runtime</div>

    <div class="cards">
      <div class="card"><div class="card-title">NET EQUITY</div><div class="card-value positive" id="netEquity">loading...</div></div>
      <div class="card"><div class="card-title">WIN RATE</div><div class="card-value" id="winRate">loading...</div></div>
      <div class="card"><div class="card-title">TOTAL EXECUTIONS</div><div class="card-value" id="totalExecutions">loading...</div></div>
      <div class="card"><div class="card-title">MAX DRAWDOWN</div><div class="card-value negative" id="maxDrawdown">loading...</div></div>
    </div>

    <div class="panel">
      <h2>📈 Equity Curve</h2>
      <canvas id="equityChart"></canvas>
    </div>

    <div class="panel">
      <h2>📋 Trade History</h2>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>PAIR</th><th>ENTRY</th><th>EXIT</th><th>PNL</th><th>RESULT</th>
            </tr>
          </thead>
          <tbody id="tradeTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="footer" id="footer">Runtime Connected</div>
  </div>

<script>
let equityChart;

async function loadDashboard() {
  try {
    const metrics = await (await fetch('http://localhost:3000/api/metrics')).json();

    document.getElementById('netEquity').innerHTML = metrics.netEquityPct + '%';
    document.getElementById('winRate').innerHTML = metrics.winRate + '%';
    document.getElementById('totalExecutions').innerHTML = metrics.totalExecutions;
    document.getElementById('maxDrawdown').innerHTML = metrics.maxDrawdownPct + '%';

    const trades = await (await fetch('http://localhost:3000/api/trades')).json();
    const tbody = document.getElementById('tradeTableBody');
    tbody.innerHTML = '';

    const equityData = [];
    const labels = [];
    let cumulative = 0;

    trades.slice().reverse().forEach((t) => {
      cumulative += Number(t.pnl);
      equityData.push(cumulative.toFixed(4));
      labels.push(t.id);

      const isWin = t.result === 'WIN';
      const row = `
        <tr>
          <td>${t.id}</td>
          <td>${t.pair}</td>
          <td>${t.entry}</td>
          <td>${t.exit}</td>
          <td class="${isWin ? 'positive' : 'negative'}">${t.pnl}%</td>
          <td class="${isWin ? 'positive' : 'negative'}">${t.result}</td>
        </tr>
      `;
      tbody.insertAdjacentHTML('beforeend', row);
    });

    if (equityChart) equityChart.destroy();

    equityChart = new Chart(document.getElementById('equityChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Equity %',
          data: equityData,
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56,189,248,0.15)',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#e2e8f0' } } },
        scales: {
          x: { ticks: { color: '#94a3b8' } },
          y: { ticks: { color: '#94a3b8' } }
        }
      }
    });

    document.getElementById('footer').innerHTML =
      `Runtime Connected • Last Sync: ${new Date().toLocaleTimeString()}`;

  } catch (err) {
    console.error(err);
    document.getElementById('footer').innerHTML = '❌ Runtime Disconnected';
  }
}

loadDashboard();
setInterval(loadDashboard, 5000);
</script>
</body>
</html>
